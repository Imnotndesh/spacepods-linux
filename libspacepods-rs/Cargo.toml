[package]
name = "libspacepods"
version = "0.5.0"
edition = "2024"

[dependencies]
btleplug = "0.11.8"
tokio = { version = "1.49.0", features = ["full"] }
futures = "0.3"
thiserror = "2.0.18"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
clap = { version = "4.4", features = ["derive", "cargo"] }
rustyline = "17.0.2"
anyhow = "1.0"
rustyline-derive = "0.11.1"
uuid = { version = "1.20.0", features = ["v4"] }
dialoguer = "0.12.0"