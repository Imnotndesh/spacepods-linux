name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ── Build libspacepods CLI ──
  libspacepods:
    name: Build libspacepods (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libglib2.0-dev

      - name: Build
        env:
          GIT_TAG: ${{ github.ref_name }}
        run: cargo build --release -p libspacepods --bin libspacepods

      - name: Strip
        run: strip target/release/libspacepods

      - name: Package tar.gz
        run: |
          mkdir -p release
          cp target/release/libspacepods release/
          cd release && tar -czf libspacepods-x86_64.tar.gz libspacepods

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: libspacepods-x86_64
          path: release/libspacepods-x86_64.tar.gz

  # ── Build spacepods-ui binary ──
  spacepods-ui:
    name: Build spacepods-ui (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libglib2.0-dev libdbus-1-dev

      - name: Build
        env:
          GIT_TAG: ${{ github.ref_name }}
        run: cargo build --release -p spacepods-ui

      - name: Strip
        run: strip target/release/spacepods-ui

      - name: Package tar.gz
        run: |
          mkdir -p release
          cp target/release/spacepods-ui release/
          cd release && tar -czf spacepods-ui-x86_64.tar.gz spacepods-ui

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: spacepods-ui-x86_64
          path: release/spacepods-ui-x86_64.tar.gz

  # ── Build Flatpak ──
  flatpak:
    name: Build Flatpak
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-47
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: spacepods.flatpak
          manifest-path: spacepods-ui/com.spacepods.ui.json
          cache-key: flatpak-builder-${{ github.sha }}

      - name: Upload Flatpak
        uses: actions/upload-artifact@v5
        with:
          name: spacepods-flatpak
          path: spacepods.flatpak

  # ── Release ──
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [libspacepods, spacepods-ui, flatpak]
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Prepare assets
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p release-assets
          cp artifacts/libspacepods-x86_64/libspacepods-x86_64.tar.gz release-assets/
          cp artifacts/spacepods-ui-x86_64/spacepods-ui-x86_64.tar.gz release-assets/
          cp artifacts/spacepods-flatpak/spacepods.flatpak release-assets/

          cat > release-assets/install.sh << SCRIPT
          #!/bin/sh
          set -eu
          echo "Installing libspacepods ${TAG}..."
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/libspacepods-x86_64.tar.gz"
          curl -sSL "\$URL" | sudo tar -xzf - -C /usr/local/bin
          echo "libspacepods ${TAG} installed. Run 'libspacepods service' to start."
          SCRIPT
          chmod +x release-assets/install.sh

          cat > release-assets/notes.md << NOTES
          ## SpacePods Linux ${TAG}

          ### libspacepods daemon
          \`\`\`sh
          curl -sSL https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/install.sh | sudo sh
          \`\`\`

          ### spacepods-ui binary
          Download \`spacepods-ui-x86_64.tar.gz\` and extract.

          ### Flatpak
          \`\`\`sh
          flatpak install --user spacepods.flatpak
          \`\`\`
          NOTES

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          body_path: release-assets/notes.md
          name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
