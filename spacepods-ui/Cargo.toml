[package]
name = "spacepods-ui"
version.workspace = true
edition.workspace = true

[dependencies]
gtk4 = { version = "0.11.3", features = ["v4_10"] }
libadwaita = { version = "0.9.1", features = ["v1_4"] }
glib = "0.22.7"
ksni = { version = "0.3", features = ["blocking"] }
gio = "0.22.6"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[build-dependencies]
