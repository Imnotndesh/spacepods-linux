<svg xmlns="http://www.w3.org/2000/svg" height="128px" viewBox="0 0 128 128" width="128px">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3584e4"/>
      <stop offset="100%" stop-color="#1c71d8"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>
  <!-- Headphones/earbuds silhouette -->
  <g fill="#ffffff" transform="translate(64,64)">
    <!-- Left bud -->
    <ellipse cx="-28" cy="-10" rx="20" ry="22" fill="#ffffff"/>
    <rect x="-36" y="-28" width="16" height="20" rx="8" fill="#ffffff"/>
    <!-- Right bud -->
    <ellipse cx="28" cy="-10" rx="20" ry="22" fill="#ffffff"/>
    <rect x="20" y="-28" width="16" height="20" rx="8" fill="#ffffff"/>
    <!-- Case body -->
    <rect x="-38" y="6" width="76" height="32" rx="16" fill="#ffffff" opacity="0.3"/>
    <!-- Signal arcs -->
    <path d="M-12,-22 Q0,-40 12,-22" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <path d="M-20,-14 Q0,-36 20,-14" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
    <path d="M-26,-6 Q0,-30 26,-6" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
  </g>
</svg>
